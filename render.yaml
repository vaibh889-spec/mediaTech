services:
  - type: web
    name: mediafetch-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: https://mediafetch.pages.dev
    plan: free
    healthCheckPath: /health
